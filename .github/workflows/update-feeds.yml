name: 更新万象信息源

# 架构：GitHub Actions 负责抓（免费无限额度）→ 产物提交回本仓库 → 万象 App 读取
#   App 取数走两条通道（万象的实例轮换会自动降级）：
#     ① Gitee 镜像（国内直连 ~0.1s，需仓库公开；见 README「Gitee 通道」）
#     ② ghproxy.net 转发 GitHub raw（实测 5/5 成功，0.5~0.7s）
#
# 时效性：GitHub 免费版 schedule 不保证准时，高峰期延迟 5~30 分钟，热榜场景够用。

on:
  schedule:
    - cron: '7,37 * * * *'      # 每 30 分钟（错开整点，降低排队）
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'config/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  # ── 热榜聚合（DailyHotApi）── 无需任何账号，开箱即用
  hotlist:
    name: 热榜聚合
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 拉取并启动 DailyHotApi
        run: |
          set -e
          git clone --depth 1 https://github.com/imsyy/DailyHotApi.git /tmp/dha
          cd /tmp/dha
          npm ci --no-audit --no-fund --loglevel=error 2>/dev/null || npm install --no-audit --no-fund
          npm run build
          # ⚠️ 必须带 NODE_ENV=development —— dist/index.js 里只有 development/docker 才会 serve()
          NODE_ENV=development RSS_MODE=true PORT=6688 USE_LOG_FILE=false \
            nohup node dist/index.js > /tmp/dha.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6688/ >/dev/null 2>&1 && { echo "✅ 服务就绪"; break; }
            sleep 2
          done
          curl -sf http://127.0.0.1:6688/ >/dev/null 2>&1 || { echo "❌ 启动失败"; tail -30 /tmp/dha.log; exit 1; }

      - name: 转换为万象可读的 JSON Feed
        run: |
          python3 scripts/rss_to_jsonfeed.py \
            --base http://127.0.0.1:6688 --out feeds --config config/sources.json

      - name: 提交到本仓库
        run: |
          git config user.name  "wanxiang-bot"
          git config user.email "wanxiang-bot@users.noreply.github.com"
          git add feeds/
          git diff --staged --quiet || git commit -m "feeds: 热榜更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true

      - name: 同步到 Gitee（国内直连通道，未配置则跳过）
        continue-on-error: true
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "未配置 GITEE_TOKEN，跳过（App 将走 ghproxy 通道）"; exit 0
          fi
          REPO="${{ vars.GITEE_REPO }}"; REPO="${REPO:-wanxiang-feeds}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO}.git"
          git push gitee HEAD:master --force

  # ── 微信公众号（wewe-rss）── 需一次性登录，见 README；默认关闭
  wechat:
    name: 公众号订阅
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: ${{ vars.ENABLE_WEWE == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: 解密登录态数据库（加密版入库，口令存 GitHub Secret）
        env:
          WEWE_DB_PASS: ${{ secrets.WEWE_DB_PASS }}
        run: |
          set -e
          if [ ! -f data/wewe-rss.db.enc ]; then
            echo "❌ 缺少 data/wewe-rss.db.enc —— 见 README「公众号接入」第三步"; exit 1
          fi
          if [ -z "${WEWE_DB_PASS:-}" ]; then
            echo "❌ 未配置 WEWE_DB_PASS Secret（解密口令）"; exit 1
          fi
          mkdir -p data
          # 登录态库含微信读书 cookie，绝不入库；仓库里只存加密版
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -pass env:WEWE_DB_PASS -in data/wewe-rss.db.enc -out data/wewe-rss.db
          ls -lh data/wewe-rss.db
          echo "✅ 登录态已解密（明文仅存在于本次运行，不落仓库）"

      - name: 启动 wewe-rss（SQLite 模式，复用登录态）
        run: |
          set -e
          docker run -d --name wewe -p 4000:4000 \
            -e DATABASE_TYPE=sqlite \
            -e AUTH_CODE="${{ secrets.WEWE_AUTH_CODE }}" \
            -e FEED_MODE=fulltext \
            -e SERVER_ORIGIN_URL=http://localhost:4000 \
            -e MAX_REQUEST_PER_MINUTE=30 \
            -v "$PWD/data:/app/data" \
            cooderl/wewe-rss-sqlite:latest
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/ >/dev/null 2>&1 && { echo "✅ 就绪"; break; }
            sleep 3
          done
          docker logs --tail 20 wewe

      - name: 触发更新并导出
        run: |
          set -e
          mkdir -p feeds
          curl -s -o feeds/wx-all.json --max-time 180 \
            "http://127.0.0.1:4000/feeds/all.json?update=true&limit=50" \
            -H "Authorization: ${{ secrets.WEWE_AUTH_CODE }}"
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('feeds/wx-all.json', encoding='utf-8'))
              n = len(d.get('items', []))
              print(f"✅ 公众号条目 {n} 条")
              if n == 0:
                  print("⚠️ 条目为空：登录态可能已过期，需重新登录并更新 data/wewe-rss.db")
          except Exception as e:
              print(f"❌ 导出内容不是合法 JSON：{e}"); sys.exit(1)
          PY

      - name: 提交到本仓库
        run: |
          git config user.name  "wanxiang-bot"
          git config user.email "wanxiang-bot@users.noreply.github.com"
          git add feeds/
          git diff --staged --quiet || git commit -m "feeds: 公众号更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true

      - name: 同步到 Gitee
        continue-on-error: true
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "${GITEE_TOKEN:-}" ]; then echo "未配置 GITEE_TOKEN，跳过"; exit 0; fi
          REPO="${{ vars.GITEE_REPO }}"; REPO="${REPO:-wanxiang-feeds}"
          git remote remove gitee 2>/dev/null || true
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/${GITEE_USER}/${REPO}.git"
          git push gitee HEAD:master --force
